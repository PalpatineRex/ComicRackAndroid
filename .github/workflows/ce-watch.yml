# Watches ComicRack Community Edition for new builds and opens one issue per new
# build with its release notes, so the Android-relevant changes can be ported.
# It never builds or publishes an APK. Bump ce-version.txt when a port is released.
name: Watch ComicRack CE

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be created"
        type: boolean
        default: true
      pretend_current:
        description: "Override ce-version.txt (testing), e.g. 0.9.184"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CE changelog
        run: |
          curl -fsSL -o ce_changes.txt \
            https://raw.githubusercontent.com/maforget/ComicRackCE/master/ComicRack/Output/Changes.txt

      - name: Compare versions
        id: cmp
        run: |
          current="${{ inputs.pretend_current }}"
          [ -n "$current" ] || current="$(cat ce-version.txt)"
          python3 tools/ce_watch.py ce_changes.txt "$current" > ce.json
          cat ce.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("current", d["current"], "latest", d["latest"], "new:", [b["version"] for b in d["new"]])'

      - name: Open issues for new CE builds
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          data = json.load(open("ce.json"))
          dry = os.environ["DRY_RUN"] == "true"
          for b in reversed(data["new"]):  # oldest first
              v = b["version"]
              android = "2." + v.split(".", 1)[1]
              title = f"Port ComicRack CE {v} (Android {android})"
              found = subprocess.run(["gh", "issue", "list", "--state", "all", "--search", f'"{title}" in:title',
                                      "--json", "title"], capture_output=True, text=True, check=True).stdout
              if any(i["title"] == title for i in json.loads(found)):
                  print("exists:", title); continue
              body = (f"ComicRack CE **{v}** is out. Android version for the port: **{android}**.\n\n"
                      "Triage each change: port it if it makes sense on Android, otherwise mark it PC-only.\n"
                      "When released: build with `--ce-version " + v + "`, then set `ce-version.txt` to `" + v + "`.\n\n"
                      f"### CE {v} release notes\n\n" + b["notes"] + "\n")
              if dry:
                  print("DRY RUN, would create:", title); print(body[:1500])
              else:
                  subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=True)
                  print("created:", title)
          if not data["new"]:
              print("up to date with CE", data["latest"])
          EOF
